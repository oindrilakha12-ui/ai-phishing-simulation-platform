# PhishGuard local stack: PostgreSQL + FastAPI + Next.js (+ optional Redis via the "redis" profile).
#   docker compose up --build
#   docker compose --profile redis up --build     # also starts Redis (feature flag REDIS_URL)
# NOTE: written and reviewed, but NOT executed on the author's machine (Docker daemon was not running).
name: phishguard

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: phishguard
      POSTGRES_USER: phishguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phishguard -d phishguard"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://phishguard:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/phishguard
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (32+ chars)}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      FRONTEND_ORIGIN: http://localhost:3000
      AI_PROVIDER: ${AI_PROVIDER:-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CHROMA_PATH: /data/chroma
      REDIS_URL: ${REDIS_URL:-}
    volumes:
      - chroma:/data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8001
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

volumes:
  pgdata:
  chroma:
