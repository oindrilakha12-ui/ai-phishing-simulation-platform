[project]
name = "phishguard-backend"
version = "1.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/seed.py"]

[tool.ruff]
line-length = 135
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]
# S101 asserts are fine in tests/seed; B008 is FastAPI's Depends() idiom; E741 allows `l` in comprehensions
ignore = ["S101", "B008", "E741", "B904", "S311", "S105", "S106", "S324", "UP040", "UP046", "B905", "S110"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = false
no_implicit_optional = false
# Lenient mode (per project brief): Optional-narrowing and dict-inference noise is suppressed.
# Removing this list shows ~59 warnings, mostly `principal.user` being Optional. See docs/PRODUCTION_ROADMAP.md.
disable_error_code = ["union-attr", "arg-type", "assignment", "attr-defined", "misc", "operator"]
exclude = ["alembic/", "tests/"]
